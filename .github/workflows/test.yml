name: Package checks
on:
  push:
    branches: ['**']
    tags-ignore: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - name: Install the release archive in a clean project
        run: |
          archive=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          cd "$(mktemp -d)"
          npm init --yes
          npm install --offline --ignore-scripts "$RUNNER_TEMP/$archive"
          node --input-type=module -e "import {createVimNav} from '@mhariri/vimweb'; import '@mhariri/vimweb/auto'; if (typeof createVimNav !== 'function') process.exit(1)"
